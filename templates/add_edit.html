{% extends "base.html" %}
{% block content %}

<h1>{{ "Edit Transaction" if transaction else "Add Transaction" }}</h1>

<form method="POST" class="tx-form">
    <label for="date">Date</label>
    <input type="date" id="date" name="date"
           value="{{ transaction['date'] if transaction else today }}" required>

    <label for="type">Type</label>
    <select id="type" name="type" required>
        <option value="Expense" {% if transaction and transaction['type'] == 'Expense' %}selected{% endif %}>Expense</option>
        <option value="Income" {% if transaction and transaction['type'] == 'Income' %}selected{% endif %}>Income</option>
    </select>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        {% for cat in categories %}
        <option value="{{ cat }}" {% if transaction and transaction['category'] == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
    </select>

    <label for="description">Description</label>
    <input type="text" id="description" name="description" placeholder="Optional note"
           value="{{ transaction['description'] if transaction else '' }}">

    <label for="amount">Amount</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
           value="{{ transaction['amount'] if transaction else '' }}" required>

    <button type="submit" class="btn">{{ "Save Changes" if transaction else "Add Transaction" }}</button>
</form>

{% endblock %}
